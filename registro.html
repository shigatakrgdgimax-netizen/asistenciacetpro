<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar estudiante | CETPRO San Pedro de Aplao</title>
<link rel="icon" href="img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="cabecera">
  <div class="cabecera-fila">
    <a class="marca" href="index.html">
      <img src="img/logo.png" alt="Logo del CETPRO San Pedro de Aplao">
      <span><strong>CETPRO San Pedro de Aplao</strong><small>Control de asistencia</small></span>
    </a>
    <nav class="menu" aria-label="Navegación">
      <a href="index.html">Inicio</a>
      <a href="registro.html" aria-current="page">Registrar</a>
      <a href="asistencia.html">Marcar asistencia</a>
      <a href="listado.html">Listado</a>
    </nav>
  </div>
  <h1>Registrar estudiante</h1>
  <p>Completa todos los campos. El DNI solo se puede registrar una vez.</p>
</header>
<main class="contenido">
  <section class="panel">
    <form id="form-registro" novalidate>
      <div class="fila">
        <div>
          <label for="dni">DNI <span class="ayuda">(8 dígitos)</span></label>
          <input id="dni" name="dni" type="text" inputmode="numeric" maxlength="8" autocomplete="off" required>
          <p class="error-campo" id="e-dni"></p>
        </div>
        <div>
          <label for="celular">Celular <span class="ayuda">(9 dígitos, empieza con 9)</span></label>
          <input id="celular" name="celular" type="tel" inputmode="numeric" maxlength="9" autocomplete="off" required>
          <p class="error-campo" id="e-celular"></p>
        </div>
      </div>
      <div class="fila">
        <div>
          <label for="nombres">Nombres</label>
          <input id="nombres" name="nombres" type="text" maxlength="60" autocomplete="off" required>
          <p class="error-campo" id="e-nombres"></p>
        </div>
        <div>
          <label for="apellidos">Apellidos</label>
          <input id="apellidos" name="apellidos" type="text" maxlength="60" autocomplete="off" required>
          <p class="error-campo" id="e-apellidos"></p>
        </div>
      </div>
      <div>
        <label for="programa">Programa de estudios</label>
        <select id="programa" name="programa" required>
          <option value="">Elige un programa</option>
          <option>Informática</option>
          <option>Peluquería y Barbería</option>
          <option>Corte y Ensamblaje</option>
        </select>
        <p class="error-campo" id="e-programa"></p>
      </div>
      <label class="consentimiento" for="autorizo">
        <input id="autorizo" type="checkbox" required>
        <span>Los datos son ficticios o tengo autorización de la persona para registrarlos.</span>
      </label>
      <p class="error-campo" id="e-autorizo"></p>
      <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>
      <div>
        <button class="boton" id="btn-guardar" type="submit">Guardar estudiante</button>
      </div>
    </form>
  </section>
</main>
<p class="pie-claro">CETPRO San Pedro de Aplao • Examen práctico de Informática</p>
<script type="module" src="js/registro.js"></script>
</body>
</html>
